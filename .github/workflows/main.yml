name: CI

on: [push]

jobs:
  # MAUI Android Build
  build-android:
    runs-on: windows-latest
    name: Android Build
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.x

      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore 'Sample/DirectMaui2/LocalNotification.Sample/LocalNotification.Sample.csproj'

      - name: Install Android SDK dependencies (API 37 for net11.0-android)
        run: dotnet build 'Sample/DirectMaui2/LocalNotification.Sample/LocalNotification.Sample.csproj' -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:JavaSdkDirectory="$env:JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build MAUI Android
        run: dotnet publish 'Sample/DirectMaui2/LocalNotification.Sample/LocalNotification.Sample.csproj' -c Release -f net11.0-android --no-restore

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v5
        with:
          name: mauibeach-android-ci-build
          path: 'Sample/DirectMaui2/LocalNotification.Sample/bin/Release/net11.0-android/*Signed.a*'

  build-ios:
    runs-on: macos-26 # .NET 11 iOS workload (Microsoft.iOS.Sdk 27.2) requires Xcode 27.2.
    name: iOS Build
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.x

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      # - name: Show available Xcode versions
      #   run: ls /Applications | grep Xcode

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '27.2'

      - name: Show current version of Xcode
        run: xcodebuild -version

      # - name: Set XCode Version
      #   shell: bash
      #   run: |
      #     sudo xcode-select -s "/Applications/Xcode_26.2.app"
      #     echo "MD_APPLE_SDK_ROOT=/Applications/Xcode_26.2.app" >> $GITHUB_ENV

      # - name: Show available Xcode_26.2 versions
      #   run: ls /Applications/Xcode_26.2.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs

      - name: Show installed simulator runtimes
        run: xcrun simctl list runtimes

      - name: Restore Dependencies
        run: dotnet restore 'Sample/DirectMaui2/LocalNotification.Sample/LocalNotification.Sample.csproj'

      - name: Build MAUI iOS
        run: dotnet build 'Sample/DirectMaui2/LocalNotification.Sample/LocalNotification.Sample.csproj' -c Release -f net11.0-ios --no-restore /p:buildForSimulator=True /p:packageApp=True /p:ArchiveOnBuild=False

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mauibeach-ios-ci-build
          path: 'Sample/DirectMaui2/LocalNotification.Sample/bin/Release/net11.0-ios/iossimulator-arm64/**/*.app'
